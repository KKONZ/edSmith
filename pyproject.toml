[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edsmith"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5",
    "openai>=1.0",
    "datasets>=3.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.4",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tqdm>=4.66",
    "mcp>=1.0",
    "fastmcp>=2.0",
]

[project.scripts]
edsmith = "edsmith.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
training = ["coral-pytorch>=1.4", "transformers>=4.40"]  # install only in Colab GPU environment
tools = ["language-tool-python>=2.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/edsmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
