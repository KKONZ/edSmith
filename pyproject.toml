[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edsmith"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "chromadb>=0.5",
    "openai>=1.0",
    "datasets>=3.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.4",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tqdm>=4.66",
    "mcp>=1.0",
    "fastmcp>=2.0",
    "language-tool-python>=2.7",
    "spacy>=3.8",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
edsmith = "edsmith.cli:app"

[project.optional-dependencies]
training = ["coral-pytorch>=1.4", "transformers>=4.40"]  # install only in Colab GPU environment

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/edsmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
